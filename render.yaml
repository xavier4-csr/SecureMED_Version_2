services:
  - type: web
    name: securemed-qr
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # Set manually to a Neon Postgres connection string only when a
        # database-backed feature is enabled; the current synthetic demo
        # intentionally does not use a database.
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RENDER
        value: "true"
